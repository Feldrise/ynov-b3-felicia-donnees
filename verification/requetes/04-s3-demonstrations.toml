# Séance 3 (ticket 04) : les quatre démonstrations du tour d'horizon (L33), étape par étape.
# Chaque requête doit figurer telle quelle dans son script (extrait_de) ; les écritures sont suivies de leur remise en état.
# Format : voir outils/manifeste.py. Les valeurs dépendent de la graine de donnees/generer.py.

# --- 1. MongoDB : les Trésors ------------------------------------------------------------------------------
[[requete]]
id = "s3-demo-mongo-griffe-d-aube"
base = "mongo"
extrait_de = "demonstrations/s3/1-mongo-tresors.js"
requete = "db.tresors.findOne({_id: 12})"
contient = "Griffe d'Aube"

[[requete]]
id = "s3-demo-mongo-inventaire-moustique"
base = "mongo"
extrait_de = "demonstrations/s3/1-mongo-tresors.js"
requete = 'db.tresors.find({"proprietaire.id_heros": 3426}, {nom: 1, nature: 1, attributs: 1})'
lignes = 7

[[requete]]
id = "s3-demo-mongo-grimoires-griffe-de-foudre"
base = "mongo"
extrait_de = "demonstrations/s3/1-mongo-tresors.js"
