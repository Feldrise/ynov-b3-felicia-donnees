extrait_de = "demonstrations/s3/1-mongo-tresors.js"
requete = 'db.tresors.aggregate([{$match: {nature: "arme"}}, {$group: {_id: "$attributs.element", degats_moyens: {$avg: "$attributs.degats"}, nombre: {$sum: 1}}}, {$sort: {nombre: -1}}])'
lignes = 6

[[requete]]
id = "s3-demo-mongo-ajout-eclat"
base = "mongo"
extrait_de = "demonstrations/s3/1-mongo-tresors.js"
requete = 'db.tresors.updateOne({_id: 12}, {$set: {"attributs.eclat": "aube dorée"}})'
contient = '"modifiedCount":1'

[[requete]]
id = "s3-demo-mongo-eclat-visible"
base = "mongo"
extrait_de = "demonstrations/s3/1-mongo-tresors.js"
requete = "db.tresors.findOne({_id: 12}, {nom: 1, attributs: 1})"
contient = "aube dorée"

[[requete]]
id = "s3-demo-mongo-nom-du-clan-recopie"
base = "mongo"
extrait_de = "demonstrations/s3/1-mongo-tresors.js"
requete = 'db.heros.countDocuments({"clan.id_clan": 1})'
valeur = "39"

[[requete]]
id = "s3-demo-mongo-remise-en-etat"
base = "mongo"
extrait_de = "demonstrations/s3/1-mongo-tresors.js"
requete = 'db.tresors.updateOne({_id: 12}, {$unset: {"attributs.eclat": ""}})'
contient = '"modifiedCount":1'

