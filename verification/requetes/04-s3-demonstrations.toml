lignes = 1

# --- 4. Neo4j : le réseau des Clans --------------------------------------------------------------------------
[[requete]]
id = "s3-demo-neo4j-allies"
base = "neo4j"
extrait_de = "demonstrations/s3/4-neo4j-clans.cypher"
requete = "MATCH (c:Clan {id_clan: 1})-[:ALLIE_A]-(allie:Clan) RETURN allie.nom;"
lignes = 3

[[requete]]
id = "s3-demo-neo4j-allies-d-allies"
base = "neo4j"
extrait_de = "demonstrations/s3/4-neo4j-clans.cypher"
requete = "MATCH (c:Clan {id_clan: 1})-[:ALLIE_A*2]-(autre:Clan) WHERE autre <> c AND NOT (c)-[:ALLIE_A]-(autre) RETURN DISTINCT autre.nom;"
lignes = 5

[[requete]]
id = "s3-demo-postgres-allies-d-allies"
base = "postgres"
extrait_de = "demonstrations/s3/4-postgres-alliances.sql"
requete = """WITH a AS (SELECT id_clan_1 AS x, id_clan_2 AS y FROM alliance UNION SELECT id_clan_2, id_clan_1 FROM alliance)
SELECT DISTINCT c.nom
FROM a a1 JOIN a a2 ON a2.x = a1.y JOIN clan c ON c.id_clan = a2.y
WHERE a1.x = 1 AND a2.y <> 1 AND a2.y NOT IN (SELECT y FROM a WHERE x = 1);"""
lignes = 5

[[requete]]
id = "s3-demo-neo4j-chemin-diplomatique"
base = "neo4j"
extrait_de = "demonstrations/s3/4-neo4j-clans.cypher"
requete = "MATCH p = shortestPath((a:Clan {id_clan: 1})-[:ALLIE_A*]-(b:Clan {id_clan: 2})) RETURN length(p) AS alliances, [c IN nodes(p) | c.nom] AS chemin;"
contient = """6, ["Le Cercle de l'Aube", "Les Pattes des Étoiles Filantes", "Les Gardiens du Velours\""""

[[requete]]
id = "s3-demo-neo4j-espions-possibles"
base = "neo4j"
extrait_de = "demonstrations/s3/4-neo4j-clans.cypher"
requete = "MATCH (j:Joueur)-[:INCARNE]->(:Heros)-[:MEMBRE_DE]->(c:Clan {id_clan: 1}), (j)-[:INCARNE]->(:Heros)-[:MEMBRE_DE]->(autre:Clan) WHERE autre <> c AND NOT (c)-[:ALLIE_A]-(autre) RETURN count(DISTINCT j) AS joueurs;"
valeur = "22"

[[requete]]
id = "s3-demo-neo4j-duels-contre-moustique"
base = "neo4j"
extrait_de = "demonstrations/s3/4-neo4j-clans.cypher"
requete = "MATCH (v:Heros)-[r:A_PRIS_UNE_VIE_A]->(:Heros {id_heros: 3426}) RETURN v.nom, r.fois;"
lignes = 2
