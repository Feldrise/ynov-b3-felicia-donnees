erreur = "ALLOW FILTERING"

[[requete]]
id = "s3-demo-cassandra-remise-en-etat"
base = "cassandra"
extrait_de = "demonstrations/s3/3-cassandra-telemetrie.cql"
requete = "BEGIN BATCH DELETE FROM vies_par_heros WHERE id_heros = 3426 AND id_saison = 4 AND numero = 2; DELETE FROM vies_par_ile WHERE id_ile = 1 AND id_saison = 4 AND zone = 'Falaise des Soupirs' AND date_heure = '2026-11-13 08:40:00+0000' AND id_heros = 3426 AND numero = 2; APPLY BATCH;"
lignes = 0

[[requete]]
