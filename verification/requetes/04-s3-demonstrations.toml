lignes = 1

[[requete]]
id = "s3-demo-cassandra-double-ecriture"
base = "cassandra"
extrait_de = "demonstrations/s3/3-cassandra-telemetrie.cql"
requete = "BEGIN BATCH INSERT INTO vies_par_heros (id_heros, id_saison, numero, date_heure, ile, zone, cause) VALUES (3426, 4, 2, '2026-11-13 08:40:00+0000', 'Brume', 'Falaise des Soupirs', 'chute dans le vide'); INSERT INTO vies_par_ile (id_ile, id_saison, zone, date_heure, id_heros, numero, cause, id_clan) VALUES (1, 4, 'Falaise des Soupirs', '2026-11-13 08:40:00+0000', 3426, 2, 'chute dans le vide', 1); APPLY BATCH;"
lignes = 0

[[requete]]
id = "s3-demo-cassandra-journal-moustique-apres"
base = "cassandra"
extrait_de = "demonstrations/s3/3-cassandra-telemetrie.cql"
requete = "SELECT numero, date_heure, ile, zone, cause FROM vies_par_heros WHERE id_heros = 3426 AND id_saison = 4;"
lignes = 2

[[requete]]
id = "s3-demo-cassandra-limite-group-by"
base = "cassandra"
extrait_de = "demonstrations/s3/3-cassandra-telemetrie.cql"
requete = "SELECT cause, count(*) FROM vies_par_ile WHERE id_ile = 1 AND id_saison = 4 GROUP BY cause;"
erreur = "Group by is currently only supported on the columns of the PRIMARY KEY"

[[requete]]
id = "s3-demo-cassandra-limite-allow-filtering"
base = "cassandra"
