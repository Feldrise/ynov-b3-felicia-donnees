# --- 3. Cassandra : la télémétrie des Vies perdues -----------------------------------------------------------
[[requete]]
id = "s3-demo-cassandra-cle-de-partition"
base = "cassandra"
extrait_de = "demonstrations/s3/3-cassandra-telemetrie.cql"
requete = "DESCRIBE TABLE vies_par_ile;"
contient = "PRIMARY KEY ((id_ile, id_saison), zone, date_heure, id_heros, numero)"

[[requete]]
id = "s3-demo-cassandra-vies-par-zone-brume"
base = "cassandra"
extrait_de = "demonstrations/s3/3-cassandra-telemetrie.cql"
requete = "SELECT zone, count(*) FROM vies_par_ile WHERE id_ile = 1 AND id_saison = 4 GROUP BY zone;"
lignes = 4

[[requete]]
id = "s3-demo-cassandra-dernieres-vies-falaise"
