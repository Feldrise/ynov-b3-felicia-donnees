# Atelier de dénormalisation de la Séance 2 (ticket 03) : les quatre scripts de ateliers/s2/, rejoués dans l'ordre,
# puis la mesure de l'effet attendu (contrôle A5). Format : voir outils/manifeste.py.
# Les valeurs dépendent de la graine de donnees/generer.py ; le Héros de l'écran de profil est Sorbet Pelage-d'Or (8).

[[requete]]
id = "s2-profil-jointures"                    # script 1 : l'écran de profil, multi-jointures
base = "postgres"
extrait_de = "ateliers/s2/1-profil-jointures.sql"
requete = '''
SELECT h.id_heros, h.nom AS heros, j.pseudo AS joueur, l.nom AS lignee, h.niveau, h.renommee,
       c.nom AS clan, m.nom AS mentor,
       9 - (SELECT count(*) FROM vie_perdue v WHERE v.id_heros = h.id_heros AND v.id_saison = 4) AS vies_restantes,
       (SELECT coalesce(sum(t.montant), 0) FROM transaction_pelotes t WHERE t.id_heros = h.id_heros) AS bourse,
       (SELECT count(*) FROM tresor r WHERE r.id_heros_proprietaire = h.id_heros) AS nb_tresors
FROM heros h
JOIN joueur j ON j.id_joueur = h.id_joueur
JOIN lignee l ON l.id_lignee = h.id_lignee
LEFT JOIN clan c ON c.id_clan = h.id_clan
LEFT JOIN heros m ON m.id_heros = h.id_mentor
WHERE h.id_heros = 8'''
contient = "8|Sorbet Pelage-d'Or|kawa_ronron593|Rôdeur d'ombre|5|123|Le Cercle du Velours|Patapouf Pelage-d'Or|6|4097|9"

[[requete]]
id = "s2-script-1-execute"                    # le script tel que l'étudiant le lance (avec EXPLAIN ANALYZE)
