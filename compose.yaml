# Les cinq bases du Fil rouge « Neuf Vies : Les Îles de Félicia ».
# Aucun port publié : on passe par `docker compose exec` (voir le Makefile).
# Les bases sont jetables : `make down` les détruit, `make up` les recrée et recharge le jeu de données.
name: felicia            # nom du projet Compose par défaut (conteneurs felicia-<base>-1)
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: felicia
      POSTGRES_PASSWORD: felicia
      POSTGRES_DB: felicia
    healthcheck:
      # -h 127.0.0.1 : pendant l'initialisation, le serveur temporaire n'écoute que sur la socket Unix
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U felicia -d felicia"]
      interval: 3s
      timeout: 3s
      retries: 40

  mongo:
    # 7.0 et pas 8.0 : MongoDB 8.0 refuse de démarrer sur un noyau Linux >= 6.19 (SERVER-121912)
    image: mongo:7.0.45
    command: ["--wiredTigerCacheSizeGB", "0.25", "--quiet"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

  redis:
    image: redis:8.8.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 40

  cassandra:
    image: cassandra:5.0.9
    environment:
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 160M
      CASSANDRA_CLUSTER_NAME: felicia
      # Nœud unique : on supprime l'attente de stabilisation du gossip (démarrage de 75 s à 15 s)
      JVM_EXTRA_OPTS: "-Dcassandra.skip_wait_for_gossip_to_settle=0 -Dcassandra.ring_delay_ms=0"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 5s
      timeout: 15s
      retries: 50
      start_period: 20s

  neo4j:
    image: neo4j:5.26.32-community
    environment:
      NEO4J_AUTH: neo4j/felicia-neo4j
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p felicia-neo4j 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 15s
      retries: 50
      start_period: 15s
